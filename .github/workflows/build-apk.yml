name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # 3. Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm@10

      # 4. Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 6. Setup Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v3

      # 7. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 8. Build the Vite web application
      - name: Build web app
        run: pnpm run build

      # 9. Create Android project
      - name: Create Android project
        run: pnpm exec cap add android

      # 10. Copy web build into Android project
      - name: Sync Capacitor
        run: pnpm exec cap sync android

      # 11. Build Debug APK
      # IMPORTANT: Gradle must run inside the android directory
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 12. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: api-key-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error      - name: Build web app
        run: "pnpm run build"

      - name: Create Android project
        run: "pnpm exec cap add android"

      - name: Sync Capacitor
        run: "pnpm exec cap sync android"

      - name: Build APK
        run: "./android/gradlew assembleDebug --no-daemon"

      - name: Upload APK
        uses: "actions/upload-artifact@v4"
        with:
          name: "api-key-dashboard-apk"
          path: "android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: "error"
